<!DOCTYPE html>
<html class="staticrypt-html">

        <title>/*[|template_title|]*/0</title>

        <style>

            :root[data-theme="dark"] { --bg:#0b1020; --card:#131a30; --text:#e8ecf8; --muted:#94a3b8; --line:#243052; --field:#0e1428; color-scheme: dark; }
            * { box-sizing: border-box; }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased;
                background: radial-gradient(900px 500px at 15% -10%, rgba(99,102,241,.30), transparent 60%), radial-gradient(700px 500px at 100% 110%, rgba(168,85,247,.25), transparent 60%), var(--bg); }
            .hidden { display: none !important; }
            .staticrypt-content { min-height: 100%; display: grid; place-items: center; padding: 24px; }
            .staticrypt-page { width: 100%; max-width: 400px; }
            .staticrypt-form { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 36px 32px; box-shadow: 0 20px 50px -20px rgba(15,23,42,.35); text-align: center; }
            .logo { width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px -8px rgba(79,70,229,.7); }
            .staticrypt-title { margin: 0 0 6px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
            .staticrypt-instructions p { margin: 0; }
            .staticrypt-instructions p + p { color: var(--muted); font-size: .95rem; }
            .staticrypt-hr { display: none; }
            #staticrypt-form { margin-top: 24px; text-align: left; }
            .staticrypt-password-container { position: relative; margin-bottom: 14px; }
            .staticrypt-password-container input { width: 100%; padding: 14px 44px 14px 16px; font-size: 16px; color: var(--text); background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; outline: 0; transition: border-color .15s, box-shadow .15s; }
            .staticrypt-password-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.18); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; padding: 8px; box-sizing: content-box; cursor: pointer; opacity: .55; }
            :root[data-theme="dark"] .staticrypt-toggle-password-visibility { filter: invert(1); }
            .staticrypt-toggle-password-visibility:hover { opacity: .9; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--muted); font-size: .9rem; cursor: pointer; }
            .staticrypt-remember input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
            .staticrypt-form .staticrypt-decrypt-button { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; color: #fff; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 22px -10px rgba(79,70,229,.8); transition: transform .12s, filter .12s; }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(0); }
            .sl-error { color: var(--err); font-size: .9rem; margin: 0 0 12px; min-height: 0; }
            /*LOADER_CSS*/
            /*I18N_CSS*/
            .lang-floating { top: 16px; right: 64px; }
            .theme-toggle { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--text); background: var(--card); border: 1px solid var(--line); }
            .theme-toggle:hover { border-color: var(--accent); }
            .theme-toggle .moon { display: none; }
            :root[data-theme="dark"] .theme-toggle .sun { display: none; }
            :root[data-theme="dark"] .theme-toggle .moon { display: block; }
            .shake { animation: shake .35s; }
            @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
        </style>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            // you can edit these values to customize some of the behavior of StatiCrypt
            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    // show the remember me checkbox
                    // "Remember me" is always on (checkbox stays hidden and checked), so learners enter the password once per browser.
                }
            };

            const imgSrcEyeOpened =

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = toggleIcon.title = SL.t("login.hide");
                    toggleIcon.setAttribute("data-i18n-attr", "alt:login.hide,title:login.hide");
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = toggleIcon.title = SL.t("login.show");
                    toggleIcon.setAttribute("data-i18n-attr", "alt:login.show,title:login.show");
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    const err = document.getElementById("sl-error");
                    err.textContent = SL.t("login.error");
                    err.setAttribute("data-i18n", "login.error");
                    err.classList.remove("hidden");
                    const box = document.querySelector(".staticrypt-form");
                    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
                }
            });
